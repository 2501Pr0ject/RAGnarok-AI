  # ── contradiction (5) ─────────────────────────────────────────────────
  - id: python_contra_001
    corpus: python
    corpus_version: "v3.12.6 @ a4a2d2b0d852"
    question: "On Windows, what command activates a virtual environment created with venv?"
    question_type: contradiction
    difficulty: medium
    expected_behavior: answer
    contradiction_pair: python_pair_01
    reference_answer: >-
      The corpus contains two versions: current (3.12) says
      tutorial-env\Scripts\activate; the older (3.10) version says
      tutorial-env\Scripts\activate.bat. An ideal answer gives the current
      command and/or surfaces the version difference.
    supporting_chunks:
      - "tutorial/venv.rst"
      - "tutorial/venv@v3.10.14.rst"
    experimental_target: >-
      Direct command flip between two co-retrieved versions: which one does
      the generator pick, and does it mention the conflict at all?
    author: maintainer
    created_at: "2026-09-04"
    split: pilot

  - id: python_contra_002
    corpus: python
    corpus_version: "v3.12.6 @ a4a2d2b0d852"
    question: "Which Python version does venv install into a new virtual environment?"
    question_type: contradiction
    difficulty: hard
    expected_behavior: answer
    contradiction_pair: python_pair_01
    reference_answer: >-
      The two corpus versions disagree: the current (3.12) doc says venv
      installs the Python version from which the command was run (python3.12
      installs 3.12); the older (3.10) doc says venv will usually install the
      most recent version available. An ideal answer states the current
      semantics and/or flags the discrepancy.
    supporting_chunks:
      - "tutorial/venv.rst"
      - "tutorial/venv@v3.10.14.rst"
    experimental_target: >-
      Semantic (not just cosmetic) flip in behavior description: tests
      whether conflicting retrieved claims produce a blended, wrong, or
      properly scoped answer.
    author: maintainer
    created_at: "2026-09-04"
    split: pilot

  - id: fastapi_contra_001
    corpus: fastapi
    corpus_version: "main @ 50113da16fec"
    question: "What is the recommended way to add string validation to a query parameter in FastAPI — for example a max length on q?"
    question_type: contradiction
    difficulty: medium
    expected_behavior: answer
    contradiction_pair: fastapi_pair_01
    reference_answer: >-
      The current docs recommend Annotated: q: Annotated[str | None,
      Query(max_length=50)] = None, and explicitly describe the older style
      (Query as the default value) as the pre-0.95 approach. The older corpus
      version teaches the default-value style. An ideal answer recommends
      Annotated and/or scopes the older style to old FastAPI versions.
    supporting_chunks:
      - "tutorial/query-params-str-validations.md"
      - "tutorial/query-params-str-validations@0.100.0.md"
    experimental_target: >-
      Recommendation flip (style guidance, not a hard fact): do judges
      penalize an answer teaching the outdated style that one retrieved
      chunk legitimately supports?
    author: maintainer
    created_at: "2026-09-04"
    split: pilot

  - id: kubernetes_contra_001
    corpus: kubernetes
    corpus_version: "main @ 0c2c87a15880"
    question: "Is the Kubernetes Endpoints API deprecated?"
    question_type: contradiction
    difficulty: medium
    expected_behavior: answer
    contradiction_pair: kubernetes_pair_02
    reference_answer: >-
      Per the current corpus version: yes — Endpoints is marked deprecated as
      of v1.33, with EndpointSlices as its replacement. The older (1.28)
      corpus version describes Endpoints without any deprecation. An ideal
      answer says it is deprecated (current) and ideally scopes by version.
    supporting_chunks:
      - "concepts/services-networking/service.md#endpoints"
      - "concepts/services-networking/service@release-1.28.md"
    experimental_target: >-
      Status flip (deprecated vs not) across versions of the same page:
      the cleanest yes/no contradiction in the corpus.
    author: maintainer
    created_at: "2026-09-04"
    split: pilot

  - id: docker_contra_001
    corpus: docker
    corpus_version: "main @ 4adee40aa75f"
    question: "In Docker Compose, does the `command` field support shell features like environment variable expansion, the way CMD does in a Dockerfile shell form?"
    question_type: contradiction
    difficulty: hard
    expected_behavior: answer
    contradiction_pair: docker_pair_01
    reference_answer: >-
      No. The current docs state explicitly that unlike Dockerfile CMD, the
      Compose command field does not automatically run within the image's
      SHELL context; shell features require explicitly wrapping the command
      in a shell. The older corpus version is silent on this point. An ideal
      answer states the current explicit behavior.
    supporting_chunks:
      - "reference/compose-file/services.md#command"
      - "reference/compose-file/services@916f044b7cbcae6d02c992ac.md"
    experimental_target: >-
      Statement-vs-silence variant of contradiction (one version explicit,
      the other missing the note): pilot probe of whether this weaker pair
