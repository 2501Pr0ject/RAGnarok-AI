name: CI

# Release branches too: a patch release is prepared on release/X.Y.Z, cut from the previous tag, and must
# get the same checks as main before it is tagged.
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

env:
  PYTHON_VERSION_DEFAULT: "3.10"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check for conflict markers in tracked files
        run: sh scripts/check_conflict_markers.sh

      # No tag here: pyproject.toml and __version__ must agree; a development version is accepted
      - name: Check that pyproject.toml and __version__ agree
        run: python3 scripts/check_release_version.py

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  # The two type-check jobs share one definition with publish.yml: .github/actions/typecheck.
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Type check without the optional packages
        uses: ./.github/actions/typecheck
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

  # The job above installs neither torch nor transformers: with `ignore_missing_imports`, everything
  # imported from them is `Any` and the code of the local judges (HHEM, MiniCheck) is not type-checked.
  # This job checks the same sources with the two extras installed from the lock file, and runs the unit
  # tests of the judges. Both jobs must pass.
  typecheck-judges:
    name: Local judges (type check, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Type check and test with the hhem and minicheck extras
        uses: ./.github/actions/typecheck
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          local-judges: "true"

  # The unit tests of the vector store adapters run against mocks, which accept any method name and any
  # call signature. This job runs the adapters against the real client libraries, in modes that need no
  # server: a call the library does not have, or no longer has, fails here.
  vector-stores:
    name: Vector stores (real clients)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true

      # The smallest supported Python: the lower bounds below are checked where they matter most
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install dependencies with the qdrant extra
        run: uv sync --extra dev --extra qdrant

      - name: Qdrant, locked version (in-memory local mode)
        run: |
          uv run python -c "import importlib.metadata as m; print('qdrant-client', m.version('qdrant-client'))"
          uv run pytest tests/unit/adapters/vectorstore/test_qdrant_real_client.py -p no:randomly -rs

      # The bound is read from pyproject.toml, so the version tested is the one the extra declares.
      # --no-sync: `uv run` would otherwise put the locked version back.
      - name: Qdrant, lower bound of the extra
        run: |
          spec=$(grep -oE 'qdrant-client>=[0-9.]+' pyproject.toml | head -n 1)
          test -n "$spec"
          # --reinstall-package: without it uv keeps the locked version, which already satisfies the bound
          uv pip install --resolution lowest-direct --reinstall-package qdrant-client "$spec"
          installed=$(uv run --no-sync python -c "import importlib.metadata as m; print(m.version('qdrant-client'))")
          echo "qdrant-client $installed (lower bound of: $spec)"
          # Refuse to go on if the version installed is not the bound: the step would test something else
          case "$installed" in "${spec#qdrant-client>=}"*) ;; *) echo "::error::expected the lower bound of $spec, got $installed"; exit 1 ;; esac
          uv run --no-sync pytest tests/unit/adapters/vectorstore/test_qdrant_real_client.py -p no:randomly -rs

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra cli --extra ollama --extra tui

      # Random order (pytest-randomly) catches dependencies between tests; the
      # seed is the run id, so a failure reproduces with --randomly-seed=<id>
      - name: Run tests with coverage (random order)
        run: uv run pytest -p randomly --randomly-seed=${{ github.run_id }} --cov=ragnarok_ai --cov-report=xml --cov-fail-under=80

      # In a fresh process, so state cached by other test modules cannot hide
      # import bugs (the 1.12.0 RecursionError passed the full suite)
      - name: Run README examples in isolation
        run: uv run pytest tests/unit/test_readme_examples.py -p no:randomly

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  extras:
    name: Extras (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra:
          - ollama
          - openai
          - anthropic
          - qdrant
          - chroma
          - faiss
          - langchain
          - llamaindex
          - dspy
          - cli
          - telemetry
          - tui
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install with extra
        run: uv sync --extra ${{ matrix.extra }}

      - name: Test import
        run: uv run python -c "import ragnarok_ai; print(f'ragnarok_ai {ragnarok_ai.__version__} with [${{ matrix.extra }}] OK')"

  extras-all:
    name: Extras (all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install with all extras
        run: uv sync --extra all

      - name: Test imports
        run: |
          uv run python -c "
          from ragnarok_ai import __version__
          from ragnarok_ai.adapters.llm import OllamaLLM, OpenAILLM, AnthropicLLM
          from ragnarok_ai.adapters.vectorstore import QdrantVectorStore, ChromaVectorStore, FAISSVectorStore
          print(f'ragnarok_ai {__version__} with [all] OK')
          "

  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Build package
        run: uv build

      - name: Check package with twine
        run: uvx twine check dist/*

  install-smoke:
    name: Install smoke test (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Build wheel
        run: uv build --wheel

      - name: Install wheel in a clean environment (pip, no extras)
        run: |
          uv venv --seed --python ${{ env.PYTHON_VERSION_DEFAULT }} "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/venv/bin/pip" list

      - name: Run the CLI outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/ragnarok" --version
          "$RUNNER_TEMP/venv/bin/ragnarok" evaluate --demo
          "$RUNNER_TEMP/venv/bin/ragnarok" plugins --list

  install-minimum:
    name: Install smoke test (minimum core versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Build wheel
        run: uv build --wheel

      # Core dependencies only (pydantic, pydantic-settings, pyyaml, typer,
      # rich) at their declared lower bounds; extras are not covered here.
      - name: Install minimum core dependencies, then the wheel
        run: |
          uv venv --python ${{ env.PYTHON_VERSION_DEFAULT }} "$RUNNER_TEMP/venv"
          VIRTUAL_ENV="$RUNNER_TEMP/venv" uv pip install --resolution lowest-direct -r pyproject.toml
          VIRTUAL_ENV="$RUNNER_TEMP/venv" uv pip install --no-deps dist/*.whl
          VIRTUAL_ENV="$RUNNER_TEMP/venv" uv pip list

      # pydantic < 2.10 warns on fields in its protected namespace (model_*)
      - name: Import without warnings
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" -W error::UserWarning -c "import ragnarok_ai, ragnarok_ai.core.artifacts, ragnarok_ai.monitor.models"

      - name: Run the CLI outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/ragnarok" --version
          "$RUNNER_TEMP/venv/bin/ragnarok" evaluate --demo
