name: Publish to PyPI

# A pushed tag vX.Y.Z publishes to PyPI. A manual run (workflow_dispatch) is a dry run: every check and the
# build run on the chosen ref, nothing is published, and the version check runs without a tag. The chosen
# ref must be main or a release/* branch, as for a tag.
#
# A release must pass what a pull request passes. Checked here, on the tagged commit itself, and from
# the same definitions as ci.yml where one exists:
#   - the version (tag, pyproject.toml, __version__, branch, built files);
#   - ruff check, ruff format --check, conflict markers, the unit tests with coverage (Python 3.10);
#   - the two type checks and the judges' tests with their extras (.github/actions/typecheck);
#   - the vector store adapters against the real clients (.github/actions/vector-stores).
# NOT checked here, and therefore to be read on the CI and Security runs of the same commit before
# tagging (release checklist, CONTRIBUTING.md):
#   - the unit tests on Python 3.11, 3.12 and 3.13, in random order, and the README examples in isolation;
#   - the import of the package with each extra ("Extras" jobs) and the two install smoke tests;
#   - the dependency audit, the secrets scan and the container scan (security.yml).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

jobs:
  # First, and before anything is installed: what would be published is the version of pyproject.toml at
  # this commit, whatever the tag is called, and a release on PyPI cannot be replaced.
  verify:
    name: Verify the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # --on-branch reads origin/main and origin/release/*. fetch-depth: 0 brings the whole history; the
      # branches are fetched explicitly as well, since the checkout of a tag does not promise them
      - name: Fetch the branches of the repository
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Check the tag against pyproject.toml, and that the commit is on main or a release branch
        if: github.event_name == 'push'
        run: python3 scripts/check_release_version.py --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --on-branch main 'release/*'

      # Dry run: no tag, so a development version is accepted; the commit the run was started on must
      # still be one a release could be tagged on
      - name: Check the version files, and that the commit is on main or a release branch (dry run, no tag)
        if: github.event_name != 'push'
        run: python3 scripts/check_release_version.py --commit "$GITHUB_SHA" --on-branch main 'release/*'

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --extra cli --extra ollama --extra tui

      - name: Check for conflict markers in tracked files
        run: sh scripts/check_conflict_markers.sh

      - name: Run linting
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest --cov=ragnarok_ai --cov-fail-under=80

  # The same two type checks as ci.yml, from the same definition: .github/actions/typecheck.
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Type check without the optional packages
        uses: ./.github/actions/typecheck
        with:
          python-version: ${{ env.PYTHON_VERSION }}

  typecheck-judges:
    name: Local judges (type check, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Type check and test with the hhem and minicheck extras
        uses: ./.github/actions/typecheck
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          local-judges: "true"

  # The same job as in ci.yml, from the same definition: .github/actions/vector-stores.
  vector-stores:
    name: Vector stores (real clients)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Qdrant and Weaviate adapters against the real clients
        uses: ./.github/actions/vector-stores
        with:
          python-version: ${{ env.PYTHON_VERSION }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [verify, test, typecheck, typecheck-judges, vector-stores]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: uv build

      - name: Check package with twine
        run: uvx twine check dist/*

      # What is uploaded is what was checked: one wheel and one source archive, named after the version
      - name: Check that the built files carry the version
        run: python3 scripts/check_release_version.py --dist dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    # Never on a manual run: only a pushed tag publishes
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
