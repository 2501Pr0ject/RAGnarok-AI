name: Type check
description: >
  Install the project from the lock file and run mypy on src/. With `local-judges`, the hhem and
  minicheck extras are installed too and the unit tests of the judges are run. One definition for
  ci.yml and publish.yml, so that a release is checked exactly as a pull request is. The repository
  must be checked out first.

inputs:
  python-version:
    description: Python version to install
    required: true
  local-judges:
    description: >
      "true" to install the hhem and minicheck extras (torch, transformers, nltk). Without them,
      `ignore_missing_imports` makes everything imported from these packages `Any`, and the code of the
      local judges is not type-checked. Both configurations must pass: the code has to type-check with
      and without the optional packages.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.13.6"
        enable-cache: true

    - name: Set up Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: uv sync --extra dev --extra cli --extra ollama --extra tui ${{ inputs.local-judges == 'true' && '--extra hhem --extra minicheck' || '' }}

    - name: Check that the extras are installed
      if: inputs.local-judges == 'true'
      shell: bash
      run: uv run python -c "import torch, transformers, safetensors, nltk; print('torch', torch.__version__, 'transformers', transformers.__version__)"

    - name: Run mypy
      shell: bash
      run: uv run mypy src/

    # No model is downloaded: the integration tests are deselected by default, and the Hugging Face
    # libraries are put offline so that a test reaching for the Hub fails instead of downloading.
    # One test stays skipped: it needs nltk's punkt_tab data, which is not downloaded here. The tests
    # that need torch or transformers are skipped in the "Test" jobs, which do not install them.
    - name: Run the unit tests of the judges
      if: inputs.local-judges == 'true'
      shell: bash
      env:
        HF_HUB_OFFLINE: "1"
        TRANSFORMERS_OFFLINE: "1"
      run: uv run pytest tests/unit/judges -p no:randomly -rs
