name: Vector stores (real clients)
description: >
  Run the vector store adapters against the real client libraries, in modes that need no server: Qdrant in
  its in-memory local mode, Weaviate through the real signatures of its connect functions and one refused
  connection. With the locked versions, then with the lower bounds of the extras. One definition for ci.yml
  and publish.yml, so that a release checks the adapters exactly as a pull request does. The repository
  must be checked out first.

inputs:
  python-version:
    description: Python version to install (the smallest supported one, where the lower bounds matter most)
    required: true

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.13.6"
        enable-cache: true

    # The smallest supported Python: the lower bounds below are checked where they matter most
    - name: Set up Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Install dependencies with the qdrant and weaviate extras
      shell: bash
      run: uv sync --extra dev --extra qdrant --extra weaviate

    - name: Qdrant, locked version (in-memory local mode)
      shell: bash
      run: |
        uv run python -c "import importlib.metadata as m; print('qdrant-client', m.version('qdrant-client'))"
        uv run pytest tests/unit/adapters/vectorstore/test_qdrant_real_client.py -p no:randomly -rs

    # No Weaviate server: the real connect functions are bound to the adapter's arguments, and one real
    # connection attempt is made to a closed port of the loopback interface
    - name: Weaviate, locked version (signatures and a refused connection)
      shell: bash
      run: |
        uv run python -c "import importlib.metadata as m; print('weaviate-client', m.version('weaviate-client'))"
        uv run pytest tests/unit/adapters/vectorstore/test_weaviate_real_client.py -p no:randomly -rs

    # Lower bounds of the extras. Each bound is read from pyproject.toml, so the version tested is the one
    # the extra declares. --reinstall-package: without it uv keeps the locked version, which already
    # satisfies the bound. --no-sync: `uv run` would otherwise put the locked version back. A step stops
    # if the version installed is not the bound: it would be testing something else.
    - name: Qdrant, lower bound of the extra
      shell: bash
      run: |
        spec=$(grep -oE 'qdrant-client>=[0-9.]+' pyproject.toml | head -n 1)
        test -n "$spec"
        uv pip install --resolution lowest-direct --reinstall-package qdrant-client "$spec"
        installed=$(uv run --no-sync python -c "import importlib.metadata as m; print(m.version('qdrant-client'))")
        echo "qdrant-client $installed (lower bound of: $spec)"
        case "$installed" in "${spec#qdrant-client>=}"*) ;; *) echo "::error::expected the lower bound of $spec, got $installed"; exit 1 ;; esac
        uv run --no-sync pytest tests/unit/adapters/vectorstore/test_qdrant_real_client.py -p no:randomly -rs

    - name: Weaviate, lower bound of the extra
      shell: bash
      run: |
        spec=$(grep -oE 'weaviate-client>=[0-9.]+' pyproject.toml | head -n 1)
        test -n "$spec"
        uv pip install --resolution lowest-direct --reinstall-package weaviate-client "$spec"
        installed=$(uv run --no-sync python -c "import importlib.metadata as m; print(m.version('weaviate-client'))")
        echo "weaviate-client $installed (lower bound of: $spec)"
        case "$installed" in "${spec#weaviate-client>=}"*) ;; *) echo "::error::expected the lower bound of $spec, got $installed"; exit 1 ;; esac
        uv run --no-sync pytest tests/unit/adapters/vectorstore/test_weaviate_real_client.py -p no:randomly -rs
